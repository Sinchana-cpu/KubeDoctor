apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubedoctor-reader
  namespace: triage-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubedoctor-reader
  namespace: triage-lab
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubedoctor-reader
  namespace: triage-lab
subjects:
  - kind: ServiceAccount
    name: kubedoctor-reader
    namespace: triage-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubedoctor-reader
